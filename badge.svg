<svg xmlns="http://www.w3.org/2000/svg" width="132" height="20" role="img" aria-label="Try with railsbox">
  <title>Try with railsbox</title>
  <!--
    Badge autonome, servi par la sandbox elle-même : le mainteneur ne dépend
    d'aucun service tiers, pas même d'un générateur de badges. Le badge et la
    démonstration sortent de la même origine, celle de son dépôt.

    Géométrie fixe et `textLength` : GitHub relaie les images par son proxy
    camo, où aucune police n'est garantie. Sans largeur imposée, le texte
    déborderait sur les machines dont la métrique diffère.
  -->
  <linearGradient id="lustre" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
    <stop offset=".1" stop-color="#aaa" stop-opacity=".1"/>
    <stop offset=".9" stop-color="#000" stop-opacity=".3"/>
    <stop offset="1" stop-color="#000" stop-opacity=".5"/>
  </linearGradient>
  <clipPath id="arrondi">
    <rect width="132" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#arrondi)">
    <rect width="60" height="20" fill="#2b3137"/>
    <rect x="60" width="72" height="20" fill="#1f6feb"/>
    <rect width="132" height="20" fill="url(#lustre)"/>
  </g>
  <g fill="#fff" text-anchor="middle"
     font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="11">
    <text x="30" y="15" fill="#010101" fill-opacity=".3" textLength="44">Try with</text>
    <text x="30" y="14" textLength="44">Try with</text>
    <text x="96" y="15" fill="#010101" fill-opacity=".3" textLength="54" font-weight="bold">railsbox</text>
    <text x="96" y="14" textLength="54" font-weight="bold">railsbox</text>
  </g>
</svg>
